[project]
name = "steering-reasoning"
version = "0.1.0"
description = "Steering reasoning models to reduce reward hacking, sycophancy, and biased reasoning"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "inspect-ai==0.3.193",
    "datasets>=3.0",
    "openai>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "huggingface-hub>=0.26",
    "aiohttp>=3.9",
    "safetensors>=0.8.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steering_reasoning"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
